<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frases Aleatorias con Partículas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 90%;
            padding: 2rem;
        }

        .phrase-container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            transition: all 0.5s ease;
        }

        .phrase-container:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        #phrase {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .author {
            font-size: 1.5rem;
            font-weight: 400;
            color: #aaa;
            font-style: italic;
            margin-top: 1rem;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            background-color: rgba(50, 50, 150, 0.7);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            border: 2px solid rgba(100, 100, 255, 0.3);
        }

        button:hover {
            background-color: rgba(70, 70, 200, 0.9);
            transform: scale(1.05);
            border-color: rgba(150, 150, 255, 0.5);
        }

        .refresh-btn {
            background-color: rgba(50, 150, 50, 0.7);
            border-color: rgba(100, 255, 100, 0.3);
        }

        .refresh-btn:hover {
            background-color: rgba(70, 200, 70, 0.9);
            border-color: rgba(150, 255, 150, 0.5);
        }

        .info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            z-index: 2;
        }

        .particle-count {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .particle-count span {
            color: #aaa;
        }

        .particle-count input {
            width: 80px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            #phrase {
                font-size: 2.5rem;
            }
            
            .author {
                font-size: 1.2rem;
            }
            
            button {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            #phrase {
                font-size: 1.8rem;
            }
            
            .author {
                font-size: 1rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- Contenedor para las partículas -->
    <div id="particles-js"></div>
    
    <!-- Contenedor principal para la frase -->
    <div class="container">
        <div class="phrase-container">
            <h1 id="phrase">Cargando frase...</h1>
            <div id="author" class="author"></div>
        </div>
        
        <div class="controls">
            <button id="newPhrase" class="refresh-btn">Nueva Frase</button>
            <button id="shareBtn">Compartir Frase</button>
            <div class="particle-count">
                <span>Partículas:</span>
                <input type="number" id="particleNumber" min="10" max="200" value="80">
            </div>
        </div>
    </div>
    
    <div class="info">
        Las partículas interactúan con tu cursor. Mueve el mouse para ver el efecto.
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Base de datos de frases (puedes agregar o modificar aquí)
        const phrases = [
            { text: "La vida es lo que pasa mientras estás ocupado haciendo otros planes.", author: "John Lennon" },
            { text: "El único modo de hacer un gran trabajo es amar lo que haces.", author: "Steve Jobs" },
            { text: "No cuentes los días, haz que los días cuenten.", author: "Muhammad Ali" },
            { text: "La creatividad es la inteligencia divirtiéndose.", author: "Albert Einstein" },
            { text: "El éxito es ir de fracaso en fracaso sin perder el entusiasmo.", author: "Winston Churchill" },
            { text: "La mente es como un paracaídas, solo funciona si se abre.", author: "Albert Einstein" },
            { text: "El tiempo es el recurso más valioso que tenemos. Úsalo sabiamente.", author: "Anónimo" },
            { text: "La felicidad no es algo hecho. Viene de tus propias acciones.", author: "Dalai Lama" },
            { text: "El único límite para nuestro mañana serán nuestras dudas de hoy.", author: "Franklin D. Roosevelt" },
            { text: "No importa lo lento que vayas, siempre y cuando no te detengas.", author: "Confucio" },
            { text: "La mejor venganza es un éxito masivo.", author: "Frank Sinatra" },
            { text: "La vida es 10% lo que me ocurre y 90% cómo reacciono a ello.", author: "Charles Swindoll" },
            { text: "Cada día es una nueva oportunidad para cambiar tu vida.", author: "Anónimo" },
            { text: "La imaginación es más importante que el conocimiento.", author: "Albert Einstein" },
            { text: "El futuro pertenece a quienes creen en la belleza de sus sueños.", author: "Eleanor Roosevelt" }
        ];

        // Elementos del DOM
        const phraseElement = document.getElementById('phrase');
        const authorElement = document.getElementById('author');
        const newPhraseButton = document.getElementById('newPhrase');
        const shareButton = document.getElementById('shareBtn');
        const particleNumberInput = document.getElementById('particleNumber');

        // Variable para almacenar la frase actual
        let currentPhrase = null;

        // Función para obtener una frase aleatoria
        function getRandomPhrase() {
            const randomIndex = Math.floor(Math.random() * phrases.length);
            return phrases[randomIndex];
        }

        // Función para mostrar una frase aleatoria
        function displayRandomPhrase() {
            currentPhrase = getRandomPhrase();
            phraseElement.textContent = `"${currentPhrase.text}"`;
            authorElement.textContent = `- ${currentPhrase.author}`;
            
            // Animación de aparición
            phraseElement.style.opacity = 0;
            authorElement.style.opacity = 0;
            
            setTimeout(() => {
                phraseElement.style.transition = 'opacity 0.5s ease';
                authorElement.style.transition = 'opacity 0.5s ease';
                phraseElement.style.opacity = 1;
                authorElement.style.opacity = 1;
            }, 10);
        }

        // Función para compartir la frase
        function sharePhrase() {
            if (currentPhrase && navigator.share) {
                navigator.share({
                    title: 'Frase Inspiradora',
                    text: `${currentPhrase.text} - ${currentPhrase.author}`,
                    url: window.location.href
                }).catch(err => {
                    console.log('Error al compartir:', err);
                    copyToClipboard();
                });
            } else {
                copyToClipboard();
            }
        }

        // Función para copiar al portapapeles
        function copyToClipboard() {
            const textToCopy = `${currentPhrase.text} - ${currentPhrase.author}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('¡Frase copiada al portapapeles!');
            }).catch(err => {
                console.error('Error al copiar:', err);
            });
        }

        // Inicializar partículas
        function initParticles(particleCount = 80) {
            particlesJS("particles-js", {
                particles: {
                    number: {
                        value: particleCount,
                        density: {
                            enable: true,
                            value_area: 800
                        }
                    },
                    color: {
                        value: ["#ffffff", "#4fc3f7", "#4db6ac", "#f06292", "#ba68c8"]
                    },
                    shape: {
                        type: "circle",
                        stroke: {
                            width: 0,
                            color: "#000000"
                        }
                    },
                    opacity: {
                        value: 0.7,
                        random: true,
                        anim: {
                            enable: true,
                            speed: 1,
                            opacity_min: 0.3,
                            sync: false
                        }
                    },
                    size: {
                        value: 3,
                        random: true,
                        anim: {
                            enable: true,
                            speed: 2,
                            size_min: 0.3,
                            sync: false
                        }
                    },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#4fc3f7",
                        opacity: 0.4,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false,
                        attract: {
                            enable: true,
                            rotateX: 600,
                            rotateY: 1200
                        }
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: {
                            enable: true,
                            mode: "grab"
                        },
                        onclick: {
                            enable: true,
                            mode: "push"
                        },
                        resize: true
                    },
                    modes: {
                        grab: {
                            distance: 140,
                            line_linked: {
                                opacity: 1
                            }
                        },
                        push: {
                            particles_nb: 4
                        }
                    }
                },
                retina_detect: true
            });
        }

        // Actualizar número de partículas
        function updateParticleCount() {
            const particleCount = parseInt(particleNumberInput.value);
            if (particleCount >= 10 && particleCount <= 200) {
                // Destruir partículas actuales
                if (window.pJSDom && window.pJSDom.length > 0) {
                    window.pJSDom[0].pJS.fn.vendors.destroy();
                }
                
                // Inicializar con nuevo número
                initParticles(particleCount);
            } else {
                particleNumberInput.value = 80;
            }
        }

        // Event Listeners
        newPhraseButton.addEventListener('click', displayRandomPhrase);
        shareButton.addEventListener('click', sharePhrase);
        particleNumberInput.addEventListener('change', updateParticleCount);
        
        // Al hacer clic en cualquier parte de la pantalla, también se cambia la frase
        document.body.addEventListener('click', function(e) {
            // Solo cambia la frase si no se hizo clic en un botón o en el input
            if (!e.target.closest('button') && !e.target.closest('input')) {
                displayRandomPhrase();
            }
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            // Mostrar primera frase
            displayRandomPhrase();
            
            // Inicializar partículas
            initParticles();
            
            // Cambiar frase automáticamente cada 30 segundos
            setInterval(displayRandomPhrase, 30000);
        });
    </script>
</body>
</html>
