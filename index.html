<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MrRoberth</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 90%;
            padding: 2rem;
        }

        .phrase-container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            transition: all 0.5s ease;
        }

        .phrase-container:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        #phrase {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .author {
            font-size: 1.5rem;
            font-weight: 400;
            color: #aaa;
            font-style: italic;
            margin-top: 1rem;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.4rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            border: 2px solid rgba(100, 100, 255, 0.3);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        button:hover {
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            transform: scale(1.05) translateY(-3px);
            border-color: rgba(150, 150, 255, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        button:active {
            transform: scale(0.98) translateY(0);
        }

        .info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            z-index: 2;
        }

        @media (max-width: 768px) {
            #phrase {
                font-size: 2.5rem;
            }
            
            .author {
                font-size: 1.2rem;
            }
            
            button {
                padding: 1rem 2.5rem;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            #phrase {
                font-size: 1.8rem;
            }
            
            .author {
                font-size: 1rem;
            }
            
            button {
                padding: 0.9rem 2rem;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Contenedor para las partículas -->
    <div id="particles-js"></div>
    
    <!-- Contenedor principal para la frase -->
    <div class="container">
        <div class="phrase-container">
            <h1 id="phrase">Cargando frase...</h1>
            <div id="author" class="author"></div>
        </div>
        
        <div class="controls">
            <button id="newPhrase">Probar suerte</button>
        </div>
    </div>
    
    <div class="info">
        Creador - Roberto Hernández Gómez (Lerdo de tejada, Veracruz).
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Base de datos de frases (puedes agregar o modificar aquí)
        const phrases = [
            { text: "La vida es lo que pasa mientras estás ocupado haciendo otros planes.", author: "John Lennon" },
            { text: "El único modo de hacer un gran trabajo es amar lo que haces.", author: "Steve Jobs" },
            { text: "No cuentes los días, haz que los días cuenten.", author: "Muhammad Ali" },
            { text: "La creatividad es la inteligencia divirtiéndose.", author: "Albert Einstein" },
            { text: "El éxito es ir de fracaso en fracaso sin perder el entusiasmo.", author: "Winston Churchill" },
            { text: "La mente es como un paracaídas, solo funciona si se abre.", author: "Albert Einstein" },
            { text: "El tiempo es el recurso más valioso que tenemos. Úsalo sabiamente.", author: "Anónimo" },
            { text: "La felicidad no es algo hecho. Viene de tus propias acciones.", author: "Dalai Lama" },
            { text: "El único límite para nuestro mañana serán nuestras dudas de hoy.", author: "Franklin D. Roosevelt" },
            { text: "No importa lo lento que vayas, siempre y cuando no te detengas.", author: "Confucio" },
            { text: "La mejor venganza es un éxito masivo.", author: "Frank Sinatra" },
            { text: "La vida es 10% lo que me ocurre y 90% cómo reacciono a ello.", author: "Charles Swindoll" },
            { text: "Cada día es una nueva oportunidad para cambiar tu vida.", author: "Anónimo" },
            { text: "La imaginación es más importante que el conocimiento.", author: "Albert Einstein" },
            { text: "El futuro pertenece a quienes creen en la belleza de sus sueños.", author: "Eleanor Roosevelt" },
            { text: "La única forma de hacer un gran trabajo es amar lo que haces.", author: "Steve Jobs" },
            { text: "Sé el cambio que quieres ver en el mundo.", author: "Mahatma Gandhi" },
            { text: "Lo que no te mata, te hace más fuerte.", author: "Friedrich Nietzsche" },
            { text: "La educación es el arma más poderosa para cambiar el mundo.", author: "Nelson Mandela" },
            { text: "La libertad no es la ausencia de compromisos, sino la capacidad de elegir.", author: "Paulo Coelho" },
            { text: "La duda es el principio de la sabiduría.", author: "Aristóteles" },
            { text: "La simplicidad es la máxima sofisticación.", author: "Leonardo da Vinci" },
            { text: "La paciencia es amarga, pero su fruto es dulce.", author: "Jean-Jacques Rousseau" },
            { text: "La verdadera sabiduría está en reconocer la propia ignorancia.", author: "Sócrates" },
            { text: "El arte de la vida es el arte de evitar el dolor.", author: "Thomas Jefferson" },
            { text: "La mayor gloria no es no caer nunca, sino levantarse cada vez que caemos.", author: "Confucio" },
            { text: "La belleza comienza en el momento en que decides ser tú mismo.", author: "Coco Chanel" },
            { text: "El único riesgo es no tomar ningún riesgo.", author: "Mark Zuckerberg" },
            { text: "La disciplina es el puente entre metas y logros.", author: "Jim Rohn" },
            { text: "El conocimiento es poder.", author: "Francis Bacon" },
            { text: "La perseverancia es la clave del éxito.", author: "Benjamin Franklin" },
            { text: "La suerte es lo que sucede cuando la preparación encuentra la oportunidad.", author: "Séneca" },
            { text: "La confianza en sí mismo es el primer secreto del éxito.", author: "Ralph Waldo Emerson" },
            { text: "La gratitud transforma lo que tenemos en suficiente.", author: "Anónimo" },
            { text: "La paz interior comienza en el momento en que decides no permitir que otra persona o evento controle tus emociones.", author: "Pema Chödrön" }
        ];

        // Elementos del DOM
        const phraseElement = document.getElementById('phrase');
        const authorElement = document.getElementById('author');
        const newPhraseButton = document.getElementById('newPhrase');

        // Variables para control
        let currentPhrase = null;
        let phraseHistory = [];

        // Función para obtener una frase aleatoria que no se haya mostrado recientemente
        function getRandomPhrase() {
            let randomIndex;
            let attempts = 0;
            const maxAttempts = 20; // Para evitar bucle infinito
            
            // Si hay muchas frases en el historial, permitimos repetir algunas
            const maxHistory = Math.min(phrases.length - 5, 15);
            
            do {
                randomIndex = Math.floor(Math.random() * phrases.length);
                attempts++;
                
                // Si hemos intentado demasiadas veces, limpiamos el historial
                if (attempts > maxAttempts) {
                    phraseHistory = phraseHistory.slice(-5); // Mantenemos solo las últimas 5
                    break;
                }
                
            } while (phraseHistory.length < maxHistory && phraseHistory.includes(randomIndex));
            
            // Agregamos a historial si no está vacío
            if (phraseHistory.length >= maxHistory) {
                phraseHistory.shift(); // Quitamos la más antigua
            }
            
            phraseHistory.push(randomIndex);
            return phrases[randomIndex];
        }

        // Función para mostrar una frase aleatoria
        function displayRandomPhrase() {
            currentPhrase = getRandomPhrase();
            
            // Animación de desvanecimiento
            phraseElement.style.opacity = 0;
            authorElement.style.opacity = 0;
            
            setTimeout(() => {
                phraseElement.textContent = `"${currentPhrase.text}"`;
                authorElement.textContent = `- ${currentPhrase.author}`;
                
                // Animación de aparición
                phraseElement.style.transition = 'opacity 0.5s ease';
                authorElement.style.transition = 'opacity 0.5s ease';
                phraseElement.style.opacity = 1;
                authorElement.style.opacity = 1;
            }, 300);
        }

        // Inicializar partículas con más cantidad
        function initParticles() {
            particlesJS("particles-js", {
                particles: {
                    number: {
                        value: 180, // Aumentado a 180 partículas
                        density: {
                            enable: true,
                            value_area: 800
                        }
                    },
                    color: {
                        value: ["#ffffff", "#4fc3f7", "#4db6ac", "#f06292", "#ba68c8", "#ffd54f", "#81c784", "#ff8a65"]
                    },
                    shape: {
                        type: "circle",
                        stroke: {
                            width: 0,
                            color: "#000000"
                        }
                    },
                    opacity: {
                        value: 0.8,
                        random: true,
                        anim: {
                            enable: true,
                            speed: 1,
                            opacity_min: 0.3,
                            sync: false
                        }
                    },
                    size: {
                        value: 3,
                        random: true,
                        anim: {
                            enable: true,
                            speed: 2,
                            size_min: 0.5,
                            sync: false
                        }
                    },
                    line_linked: {
                        enable: true,
                        distance: 140,
                        color: "#4fc3f7",
                        opacity: 0.5,
                        width: 1.2
                    },
                    move: {
                        enable: true,
                        speed: 2.5,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false,
                        attract: {
                            enable: true,
                            rotateX: 600,
                            rotateY: 1200
                        }
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: {
                            enable: true,
                            mode: ["grab", "bubble"]
                        },
                        onclick: {
                            enable: true,
                            mode: "push"
                        },
                        resize: true
                    },
                    modes: {
                        grab: {
                            distance: 160,
                            line_linked: {
                                opacity: 1
                            }
                        },
                        bubble: {
                            distance: 200,
                            size: 6,
                            duration: 2,
                            opacity: 0.8,
                            speed: 3
                        },
                        push: {
                            particles_nb: 8
                        }
                    }
                },
                retina_detect: true
            });
        }

        // Event Listeners
        newPhraseButton.addEventListener('click', displayRandomPhrase);
        
        // Al hacer clic en cualquier parte de la pantalla, también se cambia la frase
        document.body.addEventListener('click', function(e) {
            // Solo cambia la frase si no se hizo clic en el botón
            if (e.target.id !== 'newPhrase') {
                displayRandomPhrase();
            }
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            // Mostrar primera frase
            displayRandomPhrase();
            
            // Inicializar partículas
            initParticles();
            
            // Cambiar frase automáticamente cada 25 segundos
            setInterval(displayRandomPhrase, 25000);
            
            // Efecto especial al pasar el cursor sobre el botón
            newPhraseButton.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.05) translateY(-3px)';
            });
            
            newPhraseButton.addEventListener('mouseleave', function() {
                if (document.activeElement !== this) {
                    this.style.transform = 'scale(1) translateY(0)';
                }
            });
        });
    </script>
</body>
</html>
